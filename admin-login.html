<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#D92B2B"/>
  <link rel="manifest" href="manifest.json"/>
  <title>Admin Login – Lookout</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 64px);
      padding: 40px 24px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 44px;
      width: 100%;
      max-width: 520px;
      animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-icon {
      width: 56px;
      height: 56px;
      background: var(--red-light);
      border: 1px solid var(--red-mid);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .login-icon svg { width: 28px; height: 28px; color: var(--red); }

    h1 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .sub {
      font-size: 14px;
      color: var(--text2);
      margin-bottom: 36px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 28px 0;
    }

    .btn-full {
      width: 100%;
      padding: 14px;
      background: var(--red);
      color: white;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 8px;
    }
    .btn-full:hover { background: var(--red-dark); }
    .btn-full:active { transform: scale(0.98); }

    .link-row {
      text-align: center;
      margin-top: 20px;
    }
    .link-row a {
      color: var(--red);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }
    .link-row a:hover { text-decoration: underline; }

    .demo-box {
      background: var(--blue-light);
      border: 1px solid #BFDBFE;
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      color: var(--blue);
      margin-bottom: 24px;
    }
    .demo-box strong { display: block; margin-bottom: 4px; font-weight: 600; }
  </style>
</head>
<body>

  <nav>
    <a class="logo-wrap" href="index.html">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="brand">LOOKOUT</span>
        <span class="tagline">Every Second Matters</span>
      </div>
    </a>
    <a class="btn-ghost" href="index.html">← Back to Home</a>
  </nav>

  <main>
    <div class="login-card">
      <div class="login-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1>Hospital Admin Login</h1>
      <p class="sub">Enter your credentials to access the admin dashboard.</p>

      <div class="demo-box">
        <strong>Prototype Demo</strong>
        Use any email and code to log in — e.g. <code>admin@aarogyaharyana.demo</code> / <code>HR-LOOKOUT-2026</code>
      </div>

      <div class="form-group">
        <label for="email">Hospital Email</label>
        <input type="email" id="email" placeholder="admin@aarogyaharyana.demo"/>
      </div>

      <div class="form-group">
        <label for="code">Hospital Verification Code</label>
        <input type="text" id="code" placeholder="HR-LOOKOUT-2026"/>
      </div>

      <button class="btn-full" onclick="handleLogin()">Login to Dashboard</button>

      <div class="link-row">
        <a href="hospital-setup.html">First time setting up a hospital?</a>
      </div>
    </div>
  </main>

  <script>
    function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const code = document.getElementById('code').value.trim();
      if (!email || !code) {
        alert('Please enter both your email and verification code.');
        return;
      }
      window.location.href = 'admin-dashboard.html';
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
