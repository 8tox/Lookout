plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'com.lookout.app'
  compileSdk 34

  defaultConfig {
    applicationId 'com.lookout.app'
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName '1.0.0'
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    debug {
      debuggable true
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main {
      assets.srcDirs += ['src/main/assets']
    }
  }
}

tasks.register('syncWebAssets', Copy) {
  from("${rootDir}/..") {
    include '*.html'
    include '*.css'
    include '*.js'
    include '*.json'
    include 'CNAME'
  }
  into("${projectDir}/src/main/assets/www")
}

afterEvaluate {
  tasks.named('preBuild').configure {
    dependsOn tasks.named('syncWebAssets')
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.appcompat:appcompat:1.7.0'
}
